# Wird beim Einbau dieses Pakets als DSH-Bundle automatisch angewendet.
# Theme wechseln: config.theme auf aurora | ember | mint | sakura | iris | slate |
#                  moss | crimson | arctic | voltage | sand | noir setzen.
# Danach Harness neu starten (das Desktop-Profil sammelt die
# Injection-Tabelle beim Boot ein).
- insert:
    - id: theme-vivid
      name: dsh-theme-vivid
      config:
        theme: aurora
